name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trova il progetto (scompatta lo zip se serve)
        shell: bash
        run: |
          if [ ! -f build.gradle ]; then
            zip=$(ls -1 *.zip 2>/dev/null | grep -i horror | head -1 || true)
            if [ -z "$zip" ]; then
              zip=$(ls -1 *.zip 2>/dev/null | head -1 || true)
            fi
            if [ -n "$zip" ]; then
              echo "Scompatto $zip"
              unzip -o -q "$zip"
            fi
          fi
          f=$(find . -maxdepth 3 -name build.gradle -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then
            echo "::error::build.gradle non trovato. Carica HorrorUniverse-NeoForge-1.21.1.zip nella radice del repository."
            ls -la
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$f")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Compila
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"

      - name: Riassunto errori
        if: failure()
        shell: bash
        run: |
          {
            echo "### Errori (copia da qui)"
            echo '```'
            grep -E -A3 'error:|What went wrong|Could not' "$GITHUB_WORKSPACE/build-log.txt" | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HorrorUniverse-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore
